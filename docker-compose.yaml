services:
  service-a:
    build:
      context: .
      args:
        SERVICE: service-a
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SERVICE_B_URL: http://service-b:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - service-b
      - otel-collector

  service-b:
    build:
      context: .
      args:
        SERVICE: service-b
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      WEATHER_API_KEY: ${WEATHER_API_KEY:?Copy .env.example to .env and set WEATHER_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
